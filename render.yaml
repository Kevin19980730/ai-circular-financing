services:
  - type: web
    name: ai-circular-financing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir webapp --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ACF_HOSTED
        value: "1"
